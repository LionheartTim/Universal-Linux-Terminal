name: Flatpak bundle
on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '*.py'
      - 'flatpak/**'
      - 'io.github.LionheartTim.UniversalLinuxTerminal.yml'
      - '.github/workflows/flatpak.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: io.github.LionheartTim.UniversalLinuxTerminal.yml
          bundle: Universal-Linux-Terminal-v1.0.0-x86_64.flatpak
          artifact-name: Universal-Linux-Terminal-v1.0.0-x86_64
      - name: Publish tagged release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Universal-Linux-Terminal-v1.0.0-x86_64.flatpak
          generate_release_notes: true
